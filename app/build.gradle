apply plugin: 'com.android.application'

android {
    namespace 'com.clone.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.clone.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Signing with a debug key so GitHub Actions can build
    // an installable APK without extra secrets.
    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
