apply plugin: 'com.android.application'

android {
    namespace 'com.clone.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.clone.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // GitHub Actions (এবং আপনার নিজের কম্পিউটার) যেন কোনো extra secret ছাড়াই
    // installable APK বানাতে পারে, তার জন্য debug keystore দিয়ে sign করা হয়।
    def releaseKeystore = file("debug.keystore")

    signingConfigs {
        if (releaseKeystore.exists()) {
            release {
                storeFile releaseKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug.keystore থাকলে সেটা দিয়ে sign করবে,
            // না থাকলে Gradle এর নিজের debug key ব্যবহার করবে (build fail হবে না)।
            signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // কোনো external dependency নেই — শুধু Android framework (Activity + WebView) ব্যবহার করছি।
    // তাই build এর সময় ইন্টারনেট থেকে কিছু ডাউনলোড করতে হয় না, build আরও দ্রুত ও নির্ভরযোগ্য।
}
